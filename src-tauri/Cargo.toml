[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Base64 para el blob de DPAPI: el archivo guarda texto imprimible, no bytes
# crudos, para que se pueda inspeccionar sin herramientas binarias.
base64 = "0.22"
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  # DPAPI: el token de Meta se cifra con CryptProtectData / CryptUnprotectData,
  # que es lo que permite que la conexion sobreviva al cierre de la ventana sin
  # dejar el secreto en claro en disco (Fase 0.1).
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }
